<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIWOT FANA INTERNAL MEDICINE SPECIALTY CLINIC · TV QUEUE DISPLAY</title>
<style>
:root{--bg:#07131f;--panel:#0b2133;--panel2:#061522;--line:#1d7894;--green:#31d66f;--deep:#006b4d;--mint:#d8fff5;--white:#f8fbff;--cyan:#8fc9dc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:var(--white);font-family:"Segoe UI",Arial,sans-serif}body{padding:12px}.screen{height:100%;display:grid;grid-template-rows:minmax(0,1fr) 132px;gap:12px;background:var(--bg)}.top{min-height:0;display:grid;grid-template-columns:1.05fr .95fr;gap:0}.left{min-width:0;background:#000;display:grid;grid-template-rows:118px minmax(0,1fr)}.logo{height:118px;background:#000;padding:12px 28px;display:flex;align-items:center;justify-content:center}.logo img{max-width:620px;width:85%;height:84px;object-fit:contain}.video{width:100%;height:100%;object-fit:contain;background:#000}.right{min-width:0;background:var(--panel2);padding:24px;display:grid;grid-template-rows:78px minmax(0,1fr)}.meta{display:grid;grid-template-columns:1fr 1px 1fr;gap:26px;align-items:center}.meta-line{width:1px;height:70px;background:#14e3c2}.date{font-size:18px;font-weight:600}.sub{color:var(--cyan);font-size:15px;margin-top:3px}.clock{text-align:right;font-size:42px;font-weight:900}.zone{font-size:16px;color:#ddebfa;margin-left:10px;font-weight:500}.panel{min-height:0;margin-top:12px;padding:24px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:grid;grid-template-rows:auto minmax(0,1fr)}.title{text-align:center;font-size:clamp(2rem,3.2vw,2.75rem);font-weight:900}.now-box{min-height:0;margin-top:18px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--deep));display:grid;grid-template-rows:minmax(0,1fr) auto;padding:18px 24px}.now{min-height:0;display:flex;align-items:center;justify-content:center;font-size:clamp(6rem,12vw,11rem);line-height:1;font-weight:900}.room{margin:10px 48px 0;padding:10px 18px;border-radius:8px;background:var(--mint);color:#063a30;text-align:center;font-size:clamp(1.3rem,2.4vw,2.1rem);font-weight:900}.waiting{min-width:0;border-radius:8px;padding:18px;background:linear-gradient(135deg,var(--green),var(--deep));display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}.next{font-size:28px;font-weight:900;margin-left:8px;white-space:nowrap}.tickets{min-width:0;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.ticket{min-width:0;border-radius:8px;background:var(--mint);padding:8px 12px;text-align:center;color:var(--deep)}.ticket:first-child{background:var(--white)}.ticket-num{font-size:16px;font-weight:900}.ticket-code{font-size:34px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.offline{position:fixed;left:18px;bottom:3px;font-size:11px;color:#ffd98a}@media(max-width:900px){body{padding:6px}.screen{grid-template-rows:minmax(0,1fr) 100px;gap:6px}.top{grid-template-columns:1fr}.left{display:none}.right{padding:12px}.meta{gap:10px}.date{font-size:13px}.sub{font-size:11px}.clock{font-size:30px}.panel{padding:12px}.room{margin-left:10px;margin-right:10px}.waiting{padding:8px;gap:8px}.next{font-size:16px;margin-left:2px}.ticket{padding:5px 2px}.ticket-num{font-size:11px}.ticket-code{font-size:20px}}
</style></head>
<body><div class="screen"><div class="top"><section class="left"><div class="logo"><img src="/assets/afranlogo.png" alt="HIWOT FANA INTERNAL MEDICINE SPECIALTY CLINIC"></div><video class="video" autoplay muted loop playsinline src="/assets/corridor-development-video.mp4"></video></section><section class="right"><div class="meta"><div><div class="date" id="date">Tuesday, Jun 09, 2026</div><div class="sub">HIWOT FANA INTERNAL MEDICINE SPECIALTY CLINIC · REGISTRATION QUEUE</div></div><div class="meta-line"></div><div style="text-align:right"><span class="clock" id="clock">10:45</span><span class="zone">Addis Ababa</span></div></div><div class="panel"><div class="title">NOW SERVING</div><div class="now-box"><div class="now" id="now">-</div><div class="room" id="room">GO TO ROOM -</div></div></div></section></div><section class="waiting"><div class="next">NEXT PATIENTS</div><div class="tickets" id="tickets"></div></section></div><div class="offline" id="status"></div>
<script>
const now = document.getElementById('now');
const room = document.getElementById('room');
const tickets = document.getElementById('tickets');
const status = document.getElementById('status');
let previousCall = null;
let voiceEnabled = false;

function roomFor(ticket) {
  if (ticket?.roomNumber) return ticket.roomNumber;
  if (ticket?.gender === 'Male') return '101';
  if (ticket?.gender === 'Female') return '102';
  return '-';
}

function announce(ticket) {
  if (!voiceEnabled || !ticket?.ticket || !window.speechSynthesis) return;
  const destination = roomFor(ticket);
  if (destination === '-') return;
  window.speechSynthesis.cancel();
  const message = new SpeechSynthesisUtterance(`Ticket ${ticket.ticket}. Please go to room ${destination}.`);
  message.rate = 0.9;
  message.volume = 1;
  window.speechSynthesis.speak(message);
}

function apply(display) {
  const current = display.nowServing;
  const currentRoom = roomFor(current);
  now.textContent = current?.ticket || '-';
  room.textContent = `GO TO ROOM ${currentRoom}`;
  tickets.innerHTML = Array.from({ length: 6 }, (_, index) => {
    const ticket = (display.waiting || [])[index];
    return `<div class="ticket"><div class="ticket-num">${index + 1}</div><div class="ticket-code">${ticket?.ticket || '-'}</div></div>`;
  }).join('');
  status.textContent = '';

  const callKey = current ? `${current.ticket}|${current.roomNumber || currentRoom}` : null;
  if (callKey && callKey !== previousCall) announce(current);
  previousCall = callKey;
}

async function refresh() {
  try {
    const response = await fetch('/api/queue/registration/display', { cache: 'no-store' });
    if (!response.ok) throw Error();
    apply(await response.json());
  } catch {
    status.textContent = 'Queue API offline · waiting to reconnect';
  }
}

function clock() {
  const date = new Date();
  document.getElementById('clock').textContent = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
  document.getElementById('date').textContent = date.toLocaleDateString([], { weekday: 'long', month: 'short', day: '2-digit', year: 'numeric' });
}

document.addEventListener('click', () => {
  voiceEnabled = true;
  document.documentElement.requestFullscreen?.().catch(() => {});
}, { once: true });

clock();
refresh();
setInterval(clock, 1000);
setInterval(refresh, 2000);
</script></body></html>
